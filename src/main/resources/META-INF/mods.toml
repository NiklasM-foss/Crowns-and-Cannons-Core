modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/NiklasM-foss/Crowns-and-Cannons-Core/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/NiklasM-foss/Crowns-and-Cannons-Core"
authors="${mod_authors}"
description='''${mod_description}'''
# Laeuft auf dem Server. Clients ohne diese Mod duerfen sich verbinden, sie sehen dann nur keine Flaggen-Umhaenge.
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="waystones"
    mandatory=false
    versionRange="[14,)"
    ordering="AFTER"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="moneyforeveryone"
    mandatory=false
    versionRange="[3,)"
    ordering="AFTER"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="openpartiesandclaims"
    mandatory=false
    versionRange="[0.20,)"
    ordering="AFTER"
    side="SERVER"
