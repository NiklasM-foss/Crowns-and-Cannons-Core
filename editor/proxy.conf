# Ein Eingang fuer alles: Editor unter /, Datenaustausch (bytebin) unter /data/
server {
    listen 80 default_server;
    client_max_body_size 10m;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://frontend;
    }

    # Upload-Seite fuer Flaggen (Ordner flagge/, statisch)
    location = /flagge {
        return 301 /flagge/;
    }

    location /flagge/ {
        alias /usr/share/nginx/flagge/;
        index index.html;
    }

    # Modpack fuer den Crowns-Helfer: Liste und Dateien vom Antrags-Dienst, Admin-Seite statisch
    location = /pack/crowns.json {
        proxy_pass http://antraege:8080/api/pack/liste;
        add_header Cache-Control "no-cache";
    }

    location /pack/datei/ {
        proxy_pass http://antraege:8080/api/pack/datei/;
    }

    location /pack/api/ {
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://antraege:8080/api/pack/;
    }

    location = /pack/admin {
        return 301 /pack/admin/;
    }

    location /pack/admin/ {
        alias /usr/share/nginx/pack-admin/;
        index index.html;
    }

    # Antraege: Seite statisch, Schnittstelle im eigenen Container (Ordner antraege/)
    location = /antraege {
        return 301 /antraege/;
    }

    location /antraege/api/ {
        client_max_body_size 64k;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://antraege:8080/api/;
    }

    location /antraege/ {
        alias /usr/share/nginx/antraege/;
        index index.html;
    }

    # Startseite von bytebin nicht zeigen
    location = /data/ {
        return 404;
    }

    location /data/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://bytebin:8080/;
    }

}
