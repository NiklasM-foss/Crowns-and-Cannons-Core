# Rechte-Editor fuer Crowns Core. Start: docker compose up -d --build
# Danach erreichbar unter http://<server>:8095, Port links bei Bedarf aendern.
services:
  frontend:
    build: .
    restart: unless-stopped

  bytebin:
    image: ghcr.io/lucko/bytebin:latest
    restart: unless-stopped
    volumes:
      - bytebin:/opt/bytebin/content

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - bytebin
    ports:
      - "8095:80"
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  bytebin: {}
